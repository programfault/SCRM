services:
  app:
    # 本机已有 PHP 8.4（intl、pdo_sqlite、redis）。没有这个镜像时，用 Dockerfile 构建后再改 image。
    image: php_crm/app:latest
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    command: php artisan serve --host=0.0.0.0 --port=8000

  queue:
    image: php_crm/app:latest
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    depends_on:
      - app
    command: php artisan queue:work redis --sleep=1 --tries=3 --max-time=3600

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rootsecret
      MYSQL_DATABASE: timepalace
      MYSQL_USER: timepalace
      MYSQL_PASSWORD: secret
    ports:
      - "33060:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-prootsecret"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine

volumes:
  mysql-data:
